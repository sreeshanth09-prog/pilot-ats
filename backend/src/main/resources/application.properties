# Spring Boot Configuration
# Reads PORT from environment (required by Render). Falls back to 8080 locally.
server.port=${PORT:8080}

# Gemini API Configuration
# GEMINI_API_KEY must be set as an environment variable in production (Render dashboard).
# The .env file is only used locally and is never deployed.
gemini.api.key=${GEMINI_API_KEY:missing_key}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent

# Frontend is bundled into the JAR via maven-resources-plugin (see pom.xml).
# Only classpath:/static/ is needed - no filesystem paths required.
spring.web.resources.static-locations=classpath:/static/

# Upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Server timeouts — prevent hung threads under concurrent load
server.tomcat.connection-timeout=75000
server.tomcat.threads.max=50
spring.mvc.async.request-timeout=90000
