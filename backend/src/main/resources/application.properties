# Spring Boot Configuration
server.port=8080

# Gemini API Configuration
# Fallback to system env variable if .env file loading fails
gemini.api.key=${GEMINI_API_KEY:missing_key}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent

# Serve the existing frontend folder without moving or changing its structure.
spring.web.resources.static-locations=classpath:/static/,file:../frontend/,file:frontend/

# Upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
